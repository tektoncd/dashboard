# This PipelineRun is triggered via PAC incoming webhooks for patch
# releases on existing release branches. A caller must invoke the
# incoming webhook configured in the plumbing Repository resource.
# This PipelineRun does not configure a schedule or a GitHub Actions workflow.
#
# The version and release_as_latest parameters are passed dynamically
# through the incoming webhook payload.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-patch
  annotations:
    pipelinesascode.tekton.dev/on-event: "[incoming]"
    pipelinesascode.tekton.dev/on-target-branch: "[release-v*]"
    pipelinesascode.tekton.dev/pipeline: "tekton/release-pipeline.yaml"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: release
  pipelineRef:
    name: dashboard-release
  params:
    - name: package
      value: github.com/tektoncd/dashboard
    - name: repoName
      value: dashboard
    - name: gitRevision
      value: "{{ revision }}"
    - name: imageRegistry
      value: ghcr.io
    - name: imageRegistryPath
      value: tektoncd/dashboard
    - name: imageRegistryRegions
      value: ""
    - name: imageRegistryUser
      value: tekton-robot
    - name: versionTag
      value: "{{ version }}"
    - name: releaseBucket
      value: tekton-releases
    - name: releaseAsLatest
      value: "{{ release_as_latest }}"
    - name: platforms
      value: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
    - name: koExtraArgs
      value: ""
    - name: serviceAccountImagesPath
      value: credentials
  timeouts:
    pipeline: 3h0m0s
  workspaces:
    - name: workarea
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    - name: release-secret
      secret:
        secretName: oci-release-secret
    - name: release-images-secret
      secret:
        secretName: ghcr-creds
