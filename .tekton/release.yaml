# This PipelineRun is triggered by Pipelines-as-Code when a release
# branch (release-v*) is first created. It runs the Dashboard release
# pipeline defined in tekton/release-pipeline.yaml.
#
# The release pipeline builds the frontend, publishes multi-arch images, uploads
# artifacts to the release bucket, and reports the release URLs.
# GitHub release announcements are created manually.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: release-pipeline
  annotations:
    # Trigger on push events to release branches, but ONLY when the branch
    # is first created (body.created == true), not on subsequent pushes.
    # NOTE: on-cel-expression takes precedence over on-event/on-target-branch,
    # so the branch filter MUST be included in the CEL expression.
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[refs/heads/release-v*]"
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && has(body.created) && body.created == true &&
      target_branch.startsWith("release-v")
    pipelinesascode.tekton.dev/pipeline: "tekton/release-pipeline.yaml"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  taskRunTemplate:
    serviceAccountName: release
  pipelineRef:
    name: dashboard-release
  params:
    - name: package
      value: github.com/tektoncd/dashboard
    - name: repoName
      value: dashboard
    - name: gitRevision
      value: "{{ revision }}"
    - name: imageRegistry
      value: ghcr.io
    - name: imageRegistryPath
      value: tektoncd/dashboard
    - name: imageRegistryRegions
      value: ""
    - name: imageRegistryUser
      value: tekton-robot
    # For initial releases, the version is derived from the branch name:
    # release-v0.68.x → v0.68.0
    - name: versionTag
      value: '{{ cel: pac.target_branch.replace("release-", "").replace(".x", ".0").replace("-lts", "") }}'
    - name: releaseBucket
      value: tekton-releases
    - name: releaseAsLatest
      value: "true"
    - name: platforms
      value: linux/amd64,linux/arm64,linux/s390x,linux/ppc64le
    - name: koExtraArgs
      value: ""
    - name: serviceAccountImagesPath
      value: credentials
  timeouts:
    pipeline: 3h0m0s
  workspaces:
    - name: workarea
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
    - name: release-secret
      secret:
        secretName: oci-release-secret
    - name: release-images-secret
      secret:
        secretName: ghcr-creds
