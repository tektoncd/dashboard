# Grants the Dashboard's ServiceAccount read access to Tekton Results, using
# the "tekton-results-readonly" ClusterRole that Tekton Results itself ships
# for external API consumers. Only takes effect (i.e. only matters) when
# Results is installed and --results-api is set; otherwise it's an inert
# binding to a ClusterRole that doesn't exist yet.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-dashboard-results-view
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: tekton-dashboard
    rbac.dashboard.tekton.dev/subject: tekton-dashboard
subjects:
  - kind: ServiceAccount
    name: tekton-dashboard
    namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-results-readonly
